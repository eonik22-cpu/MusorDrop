name: Build Musor Drop

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Unpack sources and build
        run: |
          mkdir work
          unzip -q ./*.zip -d work
          proj="$(dirname "$(find work -name build.gradle | head -n1)")"
          echo "Project dir: $proj"
          cd "$proj"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MusorDrop-jar
          path: work/**/build/libs/*.jar
